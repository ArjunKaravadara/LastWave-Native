name: AKWave Debug Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'Screenshot/**'
  workflow_dispatch:

jobs:
  build:
    name: Build AKWave Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AKWave-debug.apk
          ls -lh AKWave-debug.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: akwave-build-${{ github.run_number }}
          name: AKWave build ${{ github.run_number }}
          body: Custom AKWave build with @arjun_karavadara handle, AK icon and AKWave branding.
          files: AKWave-debug.apk
